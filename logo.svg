<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0b1a12"/>
      <stop offset="1" stop-color="#030806"/>
    </linearGradient>
    <linearGradient id="skin" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#7dffb4"/>
      <stop offset="1" stop-color="#16c26a"/>
    </linearGradient>
    <filter id="glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="9" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M32 0H0V32" fill="none" stroke="#1d3a29" stroke-width="1"/>
    </pattern>
  </defs>
  <rect width="512" height="512" fill="url(#bg)"/>
  <rect width="512" height="512" fill="url(#grid)" opacity=".55"/>
  <circle cx="256" cy="256" r="196" fill="none" stroke="#1f6b41" stroke-width="3" stroke-dasharray="6 14"/>

  <g filter="url(#glow)" transform="rotate(-18 256 256)">
    <!-- tail: tapered curl -->
    <path fill="url(#skin)" d="M240 318
      C 232 360, 236 398, 262 424
      C 290 452, 340 452, 360 426
      C 376 404, 364 378, 340 378
      C 322 378, 314 394, 324 404
      C 330 410, 338 406, 337 400
      C 346 410, 338 424, 322 424
      C 296 424, 276 404, 272 374
      C 268 352, 270 334, 272 318 Z"/>
    <!-- legs -->
    <g fill="none" stroke="url(#skin)" stroke-width="20" stroke-linecap="round" stroke-linejoin="round">
      <path d="M232 196 L186 176 L170 138"/>
      <path d="M280 196 L326 176 L342 138"/>
      <path d="M234 292 L184 312 L170 352"/>
      <path d="M278 292 L328 312 L342 352"/>
    </g>
    <!-- toes -->
    <g fill="url(#skin)">
      <circle cx="160" cy="124" r="9"/><circle cx="176" cy="122" r="8"/><circle cx="150" cy="138" r="8"/>
      <circle cx="352" cy="124" r="9"/><circle cx="336" cy="122" r="8"/><circle cx="362" cy="138" r="8"/>
      <circle cx="160" cy="366" r="9"/><circle cx="176" cy="368" r="8"/><circle cx="150" cy="352" r="8"/>
      <circle cx="352" cy="366" r="9"/><circle cx="336" cy="368" r="8"/><circle cx="362" cy="352" r="8"/>
    </g>
    <!-- body -->
    <ellipse cx="256" cy="250" rx="40" ry="82" fill="url(#skin)"/>
    <!-- neck + head -->
    <path fill="url(#skin)" d="M232 178 C 228 160, 222 140, 226 120 C 230 92, 244 78, 256 78
      C 268 78, 282 92, 286 120 C 290 140, 284 160, 280 178 Z"/>
    <!-- eyes -->
    <circle cx="236" cy="112" r="7" fill="#04140b"/>
    <circle cx="276" cy="112" r="7" fill="#04140b"/>
    <!-- dorsal circuit -->
    <g fill="#04140b" opacity=".75">
      <rect x="251" y="190" width="10" height="10" transform="rotate(45 256 195)"/>
      <rect x="251" y="222" width="10" height="10" transform="rotate(45 256 227)"/>
      <rect x="251" y="254" width="10" height="10" transform="rotate(45 256 259)"/>
      <rect x="251" y="286" width="10" height="10" transform="rotate(45 256 291)"/>
    </g>
  </g>
</svg>
